<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>BreazeInTheMoon</title>
</head>
<body>
    <div class="container">
        <nav class="nav-main">
            <h2>BreazeInTheMoon</h2>
            <ul class="nav-menu">
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="galeria.html">Galería</a>
                </li>
                <li>
                    <a href="#">Contáctenos</a>
                </li>
            </ul>
            <a href="inicio-sesion.html" class="btn">INICIO DE SESION<i class="fas fa-angle-double-rigth"></i></a>
        </nav>
        <hr>

        <section class="banner-one">
            <div>
                <img src="img/portada.jpg" alt="">
            </div>
        </section>

        <section class="booking">
            <h2>Entracuentra el hotel perfecto</h2>
        </section>

<aside class="banner-two">
    <div class="formul">
        <form action="#">
            <br><br><br><br><br>
            <label for="checkin"><b>Check In</b></label>
            <input type="date" id="checkin"><br><br>

            <label for="checkout"><b>Check Out</b></label>
            <input type="date" id="checkout"><br><br>

            <label for="destino"><b>Lugar de destino</b></label>
            <select id="destino" name="destino" required>
                <option value="">Selecciona un destino</option>
                <option value="san_andres">San Andrés</option>
                <option value="cartagena">Cartagena</option>
                <option value="santamarta">Santa Marta</option>
                <option value="guajira">Guajira</option>
            </select><br><br>

            <label style="display:block;"><b>Selecciona para cuántas personas es la reserva</b></label>
            <div class="personas-row">
                <div>
                    <label for="adultos">Adultos</label>
                    <input type="number" id="adultos" min="1" value="1" class="personas-input">
                </div>
                <div>
                    <label for="ninos">Niños</label>
                    <input type="number" id="ninos" min="0" value="0" class="personas-input">
                </div>
            </div>
            <label style="display:block; text-align:center;"><b>Selecciona el número de habitaciones y su capacidad</b></label>
            <div class="habitaciones-row">
                <div>
                    <label for="numeroHabitaciones">Número de habitaciones</label>
                    <input type="number" id="numeroHabitaciones" min="1" value="1" class="personas-input">
                </div>
                <div>
                    <label for="capacidadHabitacion">Capacidad por habitación</label>
                    <select id="capacidadHabitacion" class="personas-input">
                        <option value="1">1 persona</option>
                        <option value="2">2 personas</option>
                        <option value="3">3 personas</option>
                        <option value="4">4 personas</option>
                    </select>
                </div>
            </div>

                    
            <a class="btn" href="registrar.html">Consultar</a>
        </form> 
    </div>

    </div>
    <br>
    <br>

    <footer class="footer">
    </footer>
</body>
</html>
